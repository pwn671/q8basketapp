workflows:
  ios-workflow:
    name: Q8Basket iOS Build

    environment:
      xcode: latest
      cocoapods: default
      groups:
        - q8basket

    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Build React PWA
        script: |
          npm run build

      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios

      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
