name: Q8Basket iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  ios-build:
    name: Build Q8Basket iOS
    runs-on: macos-latest

    env:
      VITE_API_BASE_URL: https://admin.q8basket.com/api

      DEVELOPMENT_TEAM: 5J9VJRYZMN
      BUNDLE_ID: com.q8basket.app

      P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
      P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
      PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================

      - name: Checkout code
        uses: actions/checkout@v4


      # =========================================================
      # 2. NODE
      # =========================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm


      # =========================================================
      # 3. INSTALL DEPENDENCIES
      # =========================================================

      - name: Install dependencies
        run: |
          npm ci


      # =========================================================
      # 4. BUILD WEB APP
      # =========================================================

      - name: Build web app
        run: |
          npm run build


      # =========================================================
      # 5. SYNC CAPACITOR IOS
      # =========================================================

      - name: Sync Capacitor iOS
        run: |
          npx cap sync ios


      # =========================================================
      # 6. INSTALL COCOAPODS
      # =========================================================

      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: |
          pod install --repo-update


      # =========================================================
      # 7. CREATE SIGNING KEYCHAIN
      # =========================================================

      - name: Create signing keychain
        run: |
          security create-keychain \
            -p "build-password" \
            build.keychain-db

          security default-keychain \
            -s build.keychain-db

          security unlock-keychain \
            -p "build-password" \
            build.keychain-db

          security set-keychain-settings \
            -lut 21600 \
            build.keychain-db


      # =========================================================
      # 8. DECODE P12
      # =========================================================

      - name: Decode P12
        run: |
          echo "Decoding distribution certificate..."

          echo "$P12_BASE64" | base64 --decode > distribution.p12

          echo "Checking P12 file..."

          ls -lh distribution.p12

          file distribution.p12


      # =========================================================
      # 9. VERIFY P12 PASSWORD
      # =========================================================

      - name: Verify P12 password
        run: |
          echo "Verifying P12..."

          openssl pkcs12 \
            -info \
            -in distribution.p12 \
            -noout \
            -passin env:P12_PASSWORD

          echo "P12 password verified successfully."


      # =========================================================
      # 10. IMPORT DISTRIBUTION CERTIFICATE
      # =========================================================

      - name: Install signing certificate
        run: |
          security import distribution.p12 \
            -k build.keychain-db \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/xcodebuild

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "build-password" \
            build.keychain-db

          echo "Signing certificate installed successfully."

          security find-identity \
            -v \
            -p codesigning \
            build.keychain-db


      # =========================================================
      # 11. DECODE PROVISIONING PROFILE
      # =========================================================

      - name: Decode provisioning profile
        run: |
          echo "Decoding provisioning profile..."

          echo "$PROVISION_PROFILE_BASE64" | base64 --decode > Q8Basket_AppStore_Distribution.mobileprovision

          ls -lh Q8Basket_AppStore_Distribution.mobileprovision

          file Q8Basket_AppStore_Distribution.mobileprovision


      # =========================================================
      # 12. INSTALL PROVISIONING PROFILE
      # =========================================================

      - name: Install provisioning profile
        id: profile
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          PROFILE_PLIST=$(mktemp)

          security cms \
            -D \
            -i Q8Basket_AppStore_Distribution.mobileprovision \
            > "$PROFILE_PLIST"

          PROFILE_UUID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :UUID" \
              "$PROFILE_PLIST"
          )

          PROFILE_NAME=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Name" \
              "$PROFILE_PLIST"
          )

          PROFILE_APP_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:application-identifier" \
              "$PROFILE_PLIST"
          )

          echo "======================================"
          echo "Provisioning Profile Information"
          echo "======================================"
          echo "Name: $PROFILE_NAME"
          echo "UUID: $PROFILE_UUID"
          echo "App ID: $PROFILE_APP_ID"
          echo "======================================"

          cp \
            Q8Basket_AppStore_Distribution.mobileprovision \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_OUTPUT"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_OUTPUT"

          rm -f "$PROFILE_PLIST"


      # =========================================================
      # 13. CHECK XCODE PROJECT
      # =========================================================

      - name: Check Xcode project
        working-directory: ios/App
        run: |
          echo "======================================"
          echo "XCODE PROJECT INFORMATION"
          echo "======================================"

          xcodebuild \
            -project App.xcodeproj \
            -list

          echo ""
          echo "======================================"
          echo "XCODE WORKSPACE INFORMATION"
          echo "======================================"

          xcodebuild \
            -workspace App.xcworkspace \
            -list


      # =========================================================
      # 14. VERIFY Q8BASKET SCHEME
      # =========================================================

      - name: Verify Q8Basket scheme
        working-directory: ios/App
        run: |
          echo "======================================"
          echo "CHECKING Q8BASKET SCHEME"
          echo "======================================"

          xcodebuild \
            -workspace App.xcworkspace \
            -scheme Q8Basket \
            -showBuildSettings \
            > /tmp/q8basket_build_settings.txt

          echo "Q8Basket scheme found successfully."

          grep \
            -E "PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|CODE_SIGN_STYLE" \
            /tmp/q8basket_build_settings.txt || true


      # =========================================================
      # 15. CREATE EXPORT OPTIONS
      # =========================================================

      - name: Create ExportOptions.plist
        env:
          PROFILE_NAME: ${{ steps.profile.outputs.PROFILE_NAME }}
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>${DEVELOPMENT_TEAM}</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>${BUNDLE_ID}</key>
                  <string>${PROFILE_NAME}</string>
              </dict>

              <key>destination</key>
              <string>export</string>

              <key>compileBitcode</key>
              <false/>

              <key>stripSwiftSymbols</key>
              <true/>

              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

          echo "ExportOptions.plist created."

          cat ExportOptions.plist


      # =========================================================
      # 16. BUILD IOS ARCHIVE
      # =========================================================

      - name: Build iOS Archive
        working-directory: ios/App
        env:
          PROFILE_NAME: ${{ steps.profile.outputs.PROFILE_NAME }}
        run: |
          echo "======================================"
          echo "BUILDING Q8BASKET IOS ARCHIVE"
          echo "======================================"

          echo "Scheme: Q8Basket"
          echo "Bundle ID: $BUNDLE_ID"
          echo "Team: $DEVELOPMENT_TEAM"
          echo "Profile: $PROFILE_NAME"

          rm -rf "$GITHUB_WORKSPACE/build"

          mkdir -p "$GITHUB_WORKSPACE/build"

          xcodebuild \
            -workspace App.xcworkspace \
            -scheme Q8Basket \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$GITHUB_WORKSPACE/build/Q8Basket.xcarchive" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            clean archive


      # =========================================================
      # 17. CHECK ARCHIVE
      # =========================================================

      - name: Check Archive
        run: |
          echo "======================================"
          echo "CHECKING ARCHIVE"
          echo "======================================"

          if [ ! -d "build/Q8Basket.xcarchive" ]; then
            echo "ERROR: Q8Basket.xcarchive was not created."
            exit 1
          fi

          echo "Archive created successfully."

          ls -lah build/Q8Basket.xcarchive


      # =========================================================
      # 18. EXPORT IPA
      # =========================================================

      - name: Export IPA
        run: |
          echo "======================================"
          echo "EXPORTING IPA"
          echo "======================================"

          rm -rf build/export

          mkdir -p build/export

          xcodebuild \
            -exportArchive \
            -archivePath build/Q8Basket.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist

          echo ""
          echo "======================================"
          echo "EXPORTED FILES"
          echo "======================================"

          find build/export -maxdepth 2 -type f -print


      # =========================================================
      # 19. CHECK IPA
      # =========================================================

      - name: Check IPA
        run: |
          echo "======================================"
          echo "CHECKING IPA"
          echo "======================================"

          IPA_FILE=$(find build/export -name "*.ipa" -type f | head -n 1)

          if [ -z "$IPA_FILE" ]; then
            echo "ERROR: IPA file was not created."
            exit 1
          fi

          echo "IPA created:"
          echo "$IPA_FILE"

          ls -lh "$IPA_FILE"


      # =========================================================
      # 20. UPLOAD IPA
      # =========================================================

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Q8Basket-iOS-IPA
          path: build/export/*.ipa
          if-no-files-found: error


      # =========================================================
      # 21. UPLOAD ARCHIVE
      # =========================================================

      - name: Upload iOS Archive
        uses: actions/upload-artifact@v4
        with:
          name: Q8Basket-iOS-Archive
          path: build/Q8Basket.xcarchive
          if-no-files-found: error


      # =========================================================
      # 22. CLEANUP
      # =========================================================

      - name: Cleanup signing files
        if: always()
        run: |
          rm -f distribution.p12
          rm -f Q8Basket_AppStore_Distribution.mobileprovision
          rm -f ExportOptions.plist

          security delete-keychain build.keychain-db || true
