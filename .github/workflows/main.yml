name: Q8Basket iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  ios-build:
    runs-on: macos-latest

    env:
      VITE_API_BASE_URL: https://admin.q8basket.com/api
      DEVELOPMENT_TEAM: 5J9VJRYZMN
      BUNDLE_ID: com.q8basket.app

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout code
        uses: actions/checkout@v4

      # =========================================================
      # 2. Setup Node
      # =========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # =========================================================
      # 3. Install npm dependencies
      # =========================================================
      - name: Install dependencies
        run: npm ci

      # =========================================================
      # 4. Build React/Vite
      # =========================================================
      - name: Build web app
        run: npm run build

      # =========================================================
      # 5. Capacitor sync
      # =========================================================
      - name: Sync Capacitor iOS
        run: npx cap sync ios

      # =========================================================
      # 6. Install CocoaPods
      # =========================================================
      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: |
          pod install --repo-update

      # =========================================================
      # 7. Create temporary signing keychain
      # =========================================================
      - name: Create signing keychain
        run: |
          security create-keychain \
            -p "build-password" \
            build.keychain-db

          security default-keychain \
            -s build.keychain-db

          security unlock-keychain \
            -p "build-password" \
            build.keychain-db

          security set-keychain-settings \
            -lut 21600 \
            build.keychain-db

      # =========================================================
      # 8. Decode P12
      # =========================================================
      - name: Decode P12
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
        run: |
          echo "$P12_BASE64" | base64 --decode > distribution.p12

          echo "P12 file:"
          ls -lh distribution.p12

          file distribution.p12

      # =========================================================
      # 9. Verify P12 password
      # =========================================================
      - name: Verify P12 password
        env:
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          echo "Checking P12..."

          openssl pkcs12 \
            -info \
            -in distribution.p12 \
            -noout \
            -passin env:P12_PASSWORD

          echo "P12 password verified successfully."

      # =========================================================
      # 10. Import Apple Distribution certificate
      # =========================================================
      - name: Install signing certificate
        env:
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          security import distribution.p12 \
            -k build.keychain-db \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "build-password" \
            build.keychain-db

          echo "Available signing identities:"

          security find-identity \
            -v \
            -p codesigning \
            build.keychain-db

      # =========================================================
      # 11. Install provisioning profile
      # =========================================================
      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          mkdir -p "$PROFILE_DIR"

          echo "$PROVISIONING_PROFILE_BASE64" \
            | base64 --decode \
            > "$PROFILE_DIR/Q8Basket_AppStore_Distribution.mobileprovision"

          echo "Provisioning profile installed."

          ls -lh "$PROFILE_DIR"

      # =========================================================
      # 12. Read provisioning profile information
      # =========================================================
      - name: Read provisioning profile
        id: profile
        run: |
          PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/Q8Basket_AppStore_Distribution.mobileprovision"

          security cms \
            -D \
            -i "$PROFILE_PATH" \
            > profile.plist

          PROFILE_UUID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :UUID" \
              profile.plist
          )

          PROFILE_NAME=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Name" \
              profile.plist
          )

          PROFILE_APP_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:application-identifier" \
              profile.plist
          )

          echo "======================================"
          echo "Provisioning Profile"
          echo "======================================"
          echo "UUID: $PROFILE_UUID"
          echo "Name: $PROFILE_NAME"
          echo "App ID: $PROFILE_APP_ID"
          echo "======================================"

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_OUTPUT"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_OUTPUT"

      # =========================================================
      # 13. Check Xcode project
      # =========================================================
      - name: Check Xcode project
        working-directory: ios/App
        run: |
          echo "======================================"
          echo "XCODE FILES"
          echo "======================================"

          ls -la

          echo ""
          echo "Workspace:"
          ls -la App.xcworkspace

          echo ""
          echo "Project:"
          ls -la App.xcodeproj

      # =========================================================
      # 14. Find application target
      # =========================================================
      - name: Find App target
        id: target
        working-directory: ios/App
        run: |
          echo "======================================"
          echo "PROJECT TARGETS"
          echo "======================================"

          xcodebuild \
            -project App.xcodeproj \
            -list

          echo ""
          echo "======================================"
          echo "Finding application target..."
          echo "======================================"

          TARGET_NAME=$(
            xcodebuild \
              -project App.xcodeproj \
              -list |
            awk '
              /^Targets:/ {
                found=1
                next
              }

              found && NF {
                print $0
                exit
              }
            ' |
            sed 's/^[[:space:]]*//;s/[[:space:]]*$//'
          )

          if [ -z "$TARGET_NAME" ]; then
            echo "ERROR: Could not find an Xcode target."
            exit 1
          fi

          echo "Detected target: $TARGET_NAME"

          echo "TARGET_NAME=$TARGET_NAME" >> "$GITHUB_OUTPUT"

      # =========================================================
      # 15. Create shared Xcode scheme
      # =========================================================
      - name: Create shared App scheme
        working-directory: ios/App
        env:
          TARGET_NAME: ${{ steps.target.outputs.TARGET_NAME }}
        run: |
          echo "Creating shared Xcode scheme..."

          mkdir -p App.xcodeproj/xcshareddata/xcschemes

          TARGET_ID=$(
            grep -B 3 -m 1 \
              "name = $TARGET_NAME;" \
              App.xcodeproj/project.pbxproj |
            grep -Eo '[A-F0-9]{24}' |
            head -n 1
          )

          if [ -z "$TARGET_ID" ]; then
            echo "Could not automatically find target ID."
            echo "Trying to use App target..."

            TARGET_ID=$(
              grep -B 3 -m 1 \
                'name = App;' \
                App.xcodeproj/project.pbxproj |
              grep -Eo '[A-F0-9]{24}' |
              head -n 1
            )
          fi

          if [ -z "$TARGET_ID" ]; then
            echo "ERROR: Target ID not found."
            exit 1
          fi

          echo "Target name: $TARGET_NAME"
          echo "Target ID: $TARGET_ID"

          cat > App.xcodeproj/xcshareddata/xcschemes/App.xcscheme <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <Scheme
             LastUpgradeVersion = "1600"
             version = "1.7">

             <BuildAction
                parallelizeBuildables = "YES"
                buildImplicitDependencies = "YES">

                <BuildActionEntries>

                   <BuildActionEntry
                      buildForTesting = "YES"
                      buildForRunning = "YES"
                      buildForProfiling = "YES"
                      buildForArchiving = "YES"
                      buildForAnalyzing = "YES">

                      <BuildableReference
                         BuildableIdentifier = "primary"
                         BlueprintIdentifier = "$TARGET_ID"
                         BuildableName = "$TARGET_NAME.app"
                         BlueprintName = "$TARGET_NAME"
                         ReferencedContainer = "container:App.xcodeproj">
                      </BuildableReference>

                   </BuildActionEntry>

                </BuildActionEntries>

             </BuildAction>

             <TestAction
                buildConfiguration = "Debug"
                selectedDebuggerIdentifier = "Xcode.DebuggerFoundation.Debugger.LLDB"
                selectedLauncherIdentifier = "Xcode.DebuggerFoundation.Launcher.LLDB"
                shouldUseLaunchSchemeArgsEnv = "YES">

             </TestAction>

             <LaunchAction
                buildConfiguration = "Debug"
                selectedDebuggerIdentifier = "Xcode.DebuggerFoundation.Debugger.LLDB"
                selectedLauncherIdentifier = "Xcode.DebuggerFoundation.Launcher.LLDB"
                launchStyle = "0"
                useCustomWorkingDirectory = "NO"
                ignoresPersistentStateOnLaunch = "NO"
                debugDocumentVersioning = "YES"
                debugServiceExtension = "internal"
                allowLocationSimulation = "YES">

                <BuildableProductRunnable
                   runnableDebuggingMode = "0">

                   <BuildableReference
                      BuildableIdentifier = "primary"
                      BlueprintIdentifier = "$TARGET_ID"
                      BuildableName = "$TARGET_NAME.app"
                      BlueprintName = "$TARGET_NAME"
                      ReferencedContainer = "container:App.xcodeproj">
                   </BuildableReference>

                </BuildableProductRunnable>

             </LaunchAction>

             <ProfileAction
                buildConfiguration = "Release"
                shouldUseLaunchSchemeArgsEnv = "YES"
                savedToolIdentifier = ""
                useCustomWorkingDirectory = "NO"
                debugDocumentVersioning = "YES">

                <BuildableProductRunnable
                   runnableDebuggingMode = "0">

                   <BuildableReference
                      BuildableIdentifier = "primary"
                      BlueprintIdentifier = "$TARGET_ID"
                      BuildableName = "$TARGET_NAME.app"
                      BlueprintName = "$TARGET_NAME"
                      ReferencedContainer = "container:App.xcodeproj">
                   </BuildableReference>

                </BuildableProductRunnable>

             </ProfileAction>

             <AnalyzeAction
                buildConfiguration = "Debug">
             </AnalyzeAction>

             <ArchiveAction
                buildConfiguration = "Release"
                revealArchiveInOrganizer = "YES"
                customArchiveName = "Q8Basket">
             </ArchiveAction>

          </Scheme>
          EOF

          echo "======================================"
          echo "Created scheme:"
          echo "======================================"

          cat App.xcodeproj/xcshareddata/xcschemes/App.xcscheme

      # =========================================================
      # 16. Verify scheme
      # =========================================================
      - name: Verify Xcode scheme
        working-directory: ios/App
        run: |
          echo "======================================"
          echo "AVAILABLE WORKSPACE SCHEMES"
          echo "======================================"

          xcodebuild \
            -workspace App.xcworkspace \
            -list

      # =========================================================
      # 17. Create ExportOptions.plist
      # =========================================================
      - name: Create ExportOptions.plist
        env:
          PROFILE_NAME: ${{ steps.profile.outputs.PROFILE_NAME }}
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">

          <plist version="1.0">
          <dict>

              <key>method</key>
              <string>app-store</string>

              <key>destination</key>
              <string>export</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>${DEVELOPMENT_TEAM}</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>${BUNDLE_ID}</key>
                  <string>${PROFILE_NAME}</string>
              </dict>

              <key>stripSwiftSymbols</key>
              <true/>

              <key>compileBitcode</key>
              <false/>

              <key>uploadSymbols</key>
              <true/>

          </dict>
          </plist>
          EOF

          echo "ExportOptions.plist:"
          cat ExportOptions.plist

      # =========================================================
      # 18. Build Archive
      # =========================================================
      - name: Build iOS Archive
        working-directory: ios/App
        env:
          PROFILE_NAME: ${{ steps.profile.outputs.PROFILE_NAME }}
        run: |
          echo "======================================"
          echo "BUILDING IOS ARCHIVE"
          echo "======================================"

          echo "Scheme: App"
          echo "Bundle ID: $BUNDLE_ID"
          echo "Team: $DEVELOPMENT_TEAM"
          echo "Profile: $PROFILE_NAME"

          rm -rf "$GITHUB_WORKSPACE/build"

          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$GITHUB_WORKSPACE/build/Q8Basket.xcarchive" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            clean archive

      # =========================================================
      # 19. Check archive
      # =========================================================
      - name: Check Archive
        run: |
          echo "Checking archive..."

          ls -lah build/

          if [ ! -d "build/Q8Basket.xcarchive" ]; then
            echo "ERROR: Q8Basket.xcarchive was not created."
            exit 1
          fi

          echo "Archive created successfully."

      # =========================================================
      # 20. Export IPA
      # =========================================================
      - name: Export IPA
        run: |
          rm -rf build/export

          xcodebuild \
            -exportArchive \
            -archivePath build/Q8Basket.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist

      # =========================================================
      # 21. Check IPA
      # =========================================================
      - name: Check IPA
        run: |
          echo "======================================"
          echo "IPA FILE"
          echo "======================================"

          find build/export \
            -type f \
            -name "*.ipa" \
            -print

          IPA_FILE=$(find build/export -type f -name "*.ipa" | head -n 1)

          if [ -z "$IPA_FILE" ]; then
            echo "ERROR: IPA was not created."
            exit 1
          fi

          echo "IPA created:"
          echo "$IPA_FILE"

      # =========================================================
      # 22. Upload IPA
      # =========================================================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Q8Basket-iOS-IPA
          path: build/export/*.ipa
          if-no-files-found: error

      # =========================================================
      # 23. Upload Archive
      # =========================================================
      - name: Upload iOS Archive
        uses: actions/upload-artifact@v4
        with:
          name: Q8Basket-iOS-Archive
          path: build/Q8Basket.xcarchive
          if-no-files-found: error

      # =========================================================
      # 24. Cleanup
      # =========================================================
      - name: Cleanup signing files
        if: always()
        run: |
          security delete-keychain build.keychain-db || true

          rm -f distribution.p12
          rm -f profile.plist
          rm -f ExportOptions.plist
