name: Q8Basket iOS IPA Build

on:
  workflow_dispatch:

jobs:
  ios-build:
    runs-on: macos-latest

    env:
      VITE_API_BASE_URL: "https://admin.q8basket.com/api"
      DEVELOPMENT_TEAM: "5J9VJRYZMN"
      BUNDLE_ID: "com.q8basket.app"

    steps:
      # ----------------------------------------
      # 1. Checkout
      # ----------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ----------------------------------------
      # 2. Node.js
      # ----------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ----------------------------------------
      # 3. Install dependencies
      # ----------------------------------------
      - name: Install dependencies
        run: npm ci

      # ----------------------------------------
      # 4. Build React/Vite app
      # ----------------------------------------
      - name: Build web app
        run: npm run build

      # ----------------------------------------
      # 5. Sync Capacitor
      # ----------------------------------------
      - name: Sync Capacitor iOS
        run: npx cap sync ios

      # ----------------------------------------
      # 6. Install CocoaPods
      # ----------------------------------------
      - name: Install CocoaPods dependencies
        run: |
          cd ios/App
          pod install

      # ----------------------------------------
      # 7. Install Apple Distribution Certificate
      # ----------------------------------------
      - name: Install signing certificate
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          echo "$P12_BASE64" | base64 -D > distribution.p12

          echo "Checking P12 file..."
          ls -lh distribution.p12

          security create-keychain \
            -p "build-password" \
            build.keychain-db

          security default-keychain \
            -s build.keychain-db

          security unlock-keychain \
            -p "build-password" \
            build.keychain-db

          security set-keychain-settings \
            -lut 21600 \
            build.keychain-db

          security import distribution.p12 \
            -k build.keychain-db \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "build-password" \
            build.keychain-db

          echo "Apple Distribution certificate imported successfully."

      # ----------------------------------------
      # 8. Verify P12 + Password
      # ----------------------------------------
      - name: Verify P12 password
        env:
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          openssl pkcs12 \
            -in distribution.p12 \
            -noout \
            -passin env:P12_PASSWORD

          echo "P12 password verification successful."

      # ----------------------------------------
      # 9. Install Provisioning Profile
      # ----------------------------------------
      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          echo "$PROFILE_BASE64" | base64 -D > Q8Basket.mobileprovision

          echo "Checking provisioning profile..."
          ls -lh Q8Basket.mobileprovision

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          PROFILE_UUID=$(
            security cms -D -i Q8Basket.mobileprovision |
            /usr/libexec/PlistBuddy -c "Print :UUID"
          )

          PROFILE_NAME=$(
            security cms -D -i Q8Basket.mobileprovision |
            /usr/libexec/PlistBuddy -c "Print :Name"
          )

          PROFILE_APP_ID=$(
            security cms -D -i Q8Basket.mobileprovision |
            /usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier"
          )

          echo "Profile UUID: $PROFILE_UUID"
          echo "Profile Name: $PROFILE_NAME"
          echo "Profile App ID: $PROFILE_APP_ID"

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

          cp Q8Basket.mobileprovision \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

      # ----------------------------------------
      # 10. Check Xcode Workspace
      # ----------------------------------------
      - name: Check Xcode workspace
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -list

      # ----------------------------------------
      # 11. Find Xcode Scheme
      # ----------------------------------------
      - name: Find iOS Scheme
        id: scheme
        run: |
          echo "Finding available Xcode schemes..."

          SCHEME=$(
            xcodebuild \
              -workspace ios/App/App.xcworkspace \
              -list |
            awk '
              /Schemes:/ {
                found=1
                next
              }
              found && NF {
                print $1
                exit
              }
            '
          )

          if [ -z "$SCHEME" ]; then
            echo "ERROR: No Xcode scheme found."
            exit 1
          fi

          echo "Found scheme: $SCHEME"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      # ----------------------------------------
      # 12. Build iOS Archive
      # ----------------------------------------
      - name: Build iOS Archive
        run: |
          echo "Building iOS Archive..."
          echo "Scheme: ${{ steps.scheme.outputs.scheme }}"
          echo "Bundle ID: $BUNDLE_ID"
          echo "Team ID: $DEVELOPMENT_TEAM"
          echo "Provisioning Profile: $PROFILE_NAME"

          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme "${{ steps.scheme.outputs.scheme }}" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$GITHUB_WORKSPACE/build/Q8Basket.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            OTHER_CODE_SIGN_FLAGS="--keychain $GITHUB_WORKSPACE/build.keychain-db" \
            archive

      # ----------------------------------------
      # 13. Check Archive
      # ----------------------------------------
      - name: Check Archive
        run: |
          if [ -d "$GITHUB_WORKSPACE/build/Q8Basket.xcarchive" ]; then
            echo "========================================"
            echo "iOS Archive created successfully."
            echo "========================================"

            ls -lh "$GITHUB_WORKSPACE/build/Q8Basket.xcarchive"
          else
            echo "ERROR: iOS Archive was not created."
            exit 1
          fi

      # ----------------------------------------
      # 14. Create ExportOptions.plist
      # ----------------------------------------
      - name: Create ExportOptions.plist
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>

              <key>method</key>
              <string>app-store</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>${DEVELOPMENT_TEAM}</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>${BUNDLE_ID}</key>
                  <string>${PROFILE_NAME}</string>
              </dict>

              <key>compileBitcode</key>
              <false/>

              <key>destination</key>
              <string>export</string>

          </dict>
          </plist>
          EOF

          echo "ExportOptions.plist created."

      # ----------------------------------------
      # 15. Export IPA
      # ----------------------------------------
      - name: Export IPA
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build/ipa"

          echo "Exporting IPA..."

          xcodebuild \
            -exportArchive \
            -archivePath "$GITHUB_WORKSPACE/build/Q8Basket.xcarchive" \
            -exportPath "$GITHUB_WORKSPACE/build/ipa" \
            -exportOptionsPlist "$GITHUB_WORKSPACE/ExportOptions.plist"

      # ----------------------------------------
      # 16. Check IPA
      # ----------------------------------------
      - name: Check IPA
        run: |
          echo "Checking generated IPA..."

          ls -lh "$GITHUB_WORKSPACE/build/ipa"

          IPA_FILE=$(find "$GITHUB_WORKSPACE/build/ipa" -name "*.ipa" -type f | head -1)

          if [ -z "$IPA_FILE" ]; then
            echo "ERROR: IPA file was not created."
            exit 1
          fi

          echo "========================================"
          echo "IPA created successfully:"
          echo "$IPA_FILE"
          echo "========================================"

      # ----------------------------------------
      # 17. Upload IPA
      # ----------------------------------------
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Q8Basket-iOS-IPA
          path: build/ipa/*.ipa
          if-no-files-found: error

      # ----------------------------------------
      # 18. Upload Archive
      # ----------------------------------------
      - name: Upload iOS Archive
        uses: actions/upload-artifact@v4
        with:
          name: Q8Basket-iOS-Archive
          path: build/Q8Basket.xcarchive

      # ----------------------------------------
      # 19. Cleanup
      # ----------------------------------------
      - name: Cleanup signing files
        if: always()
        run: |
          security delete-keychain build.keychain-db || true
          rm -f distribution.p12
          rm -f Q8Basket.mobileprovision
          rm -f ExportOptions.plist
