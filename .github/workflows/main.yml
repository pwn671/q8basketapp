name: Build Q8Basket iOS

on:
  workflow_dispatch:

jobs:
  ios-build:
    name: Build Q8Basket iOS
    runs-on: macos-latest

    env:
      VITE_API_BASE_URL: https://admin.q8basket.com/api
      DEVELOPMENT_TEAM: 5J9VJRYZMN
      BUNDLE_ID: com.q8basket.marketplace
      SCHEME_NAME: Q8Basket
      PROFILE_NAME: Q8Basket AppStore Distribution

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Install CocoaPods
        working-directory: ios/App
        run: pod install --repo-update

      - name: Create signing keychain
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/q8basket.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains -d user -s \
            "$KEYCHAIN_PATH"

      - name: Decode P12
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
        run: |
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"

          test -s "$RUNNER_TEMP/distribution.p12"

      - name: Verify P12
        env:
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          openssl pkcs12 \
            -info \
            -in "$RUNNER_TEMP/distribution.p12" \
            -noout \
            -passin env:P12_PASSWORD \
            -legacy

      - name: Import signing certificate
        env:
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          security import \
            "$RUNNER_TEMP/distribution.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"

      - name: Decode provisioning profile
        env:
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          echo "$IOS_PROVISION_PROFILE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/Q8Basket.mobileprovision"

          test -s "$RUNNER_TEMP/Q8Basket.mobileprovision"

      - name: Install provisioning profile
        run: |
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          mkdir -p "$PROFILE_DIR"

          UUID=$(
            security cms -D \
              -i "$RUNNER_TEMP/Q8Basket.mobileprovision" \
              | plutil -extract UUID raw -
          )

          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"

          cp \
            "$RUNNER_TEMP/Q8Basket.mobileprovision" \
            "$PROFILE_DIR/$UUID.mobileprovision"

          echo "Installed profile: $UUID"

      - name: Configure Q8Basket signing
        working-directory: ios/App
        run: |
          ruby <<'RUBY'
          require 'xcodeproj'

          project = Xcodeproj::Project.open('App.xcodeproj')

          target = project.targets.find do |t|
            t.name == 'Q8Basket'
          end

          abort 'Q8Basket target not found' unless target

          target.build_configurations.each do |config|
            next unless config.name == 'Release'

            config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
            config.build_settings['DEVELOPMENT_TEAM'] = ENV['DEVELOPMENT_TEAM']
            config.build_settings['PRODUCT_BUNDLE_IDENTIFIER'] = ENV['BUNDLE_ID']
            config.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
            config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ENV['PROFILE_NAME']
          end

          project.save

          puts 'Q8Basket signing configured.'
          RUBY

      - name: Disable signing for CocoaPods
        working-directory: ios/App
        run: |
          ruby <<'RUBY'
          require 'xcodeproj'

          project = Xcodeproj::Project.open('Pods/Pods.xcodeproj')

          project.targets.each do |target|
            target.build_configurations.each do |config|
              config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
              config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
              config.build_settings['CODE_SIGN_STYLE'] = 'Automatic'
              config.build_settings['CODE_SIGN_IDENTITY'] = ''
              config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ''
              config.build_settings['PROVISIONING_PROFILE'] = ''
            end
          end

          project.save

          puts 'CocoaPods signing disabled.'
          RUBY

      - name: Verify Q8Basket scheme
        working-directory: ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -list

          xcodebuild \
            -workspace App.xcworkspace \
            -scheme Q8Basket \
            -configuration Release \
            -showBuildSettings \
            > "$RUNNER_TEMP/build-settings.txt"

          grep -E \
            'PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE_SPECIFIER' \
            "$RUNNER_TEMP/build-settings.txt" \
            || true

      - name: Build iOS Archive
        working-directory: ios/App
        run: |
          ARCHIVE_PATH="$RUNNER_TEMP/Q8Basket.xcarchive"

          xcodebuild \
            -workspace App.xcworkspace \
            -scheme Q8Basket \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            clean archive

          test -d "$ARCHIVE_PATH"

          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"

      - name: Create ExportOptions
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>

            <key>destination</key>
            <string>export</string>

            <key>signingStyle</key>
            <string>manual</string>

            <key>teamID</key>
            <string>5J9VJRYZMN</string>

            <key>provisioningProfiles</key>
            <dict>
              <key>com.q8basket.marketplace</key>
              <string>Q8Basket AppStore Distribution</string>
            </dict>

            <key>stripSwiftSymbols</key>
            <true/>

            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          PLIST

      - name: Export IPA
        run: |
          EXPORT_PATH="$RUNNER_TEMP/export"

          mkdir -p "$EXPORT_PATH"

          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

          IPA_FILE=$(find "$EXPORT_PATH" -name "*.ipa" -type f | head -1)

          if [ -z "$IPA_FILE" ]; then
            echo "IPA was not created."
            exit 1
          fi

          echo "IPA_FILE=$IPA_FILE" >> "$GITHUB_ENV"

          ls -lh "$IPA_FILE"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Q8Basket-iOS-IPA
          path: ${{ env.IPA_FILE }}

      - name: Cleanup
        if: always()
        run: |
          security delete-keychain \
            "$KEYCHAIN_PATH" \
            2>/dev/null || true
