name: Q8Basket iOS IPA Build

on:
  workflow_dispatch:

jobs:
  ios-build:
    runs-on: macos-latest

    env:
      VITE_API_BASE_URL: "https://admin.q8basket.com/api"
      DEVELOPMENT_TEAM: "5J9VJRYZMN"
      BUNDLE_ID: "com.q8basket.app"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        run: |
          cd ios/App
          pod install

      - name: Install signing certificate
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          echo "$P12_BASE64" | base64 --decode > distribution.p12

          security create-keychain \
            -p "build-password" \
            build.keychain-db

          security default-keychain \
            -s build.keychain-db

          security unlock-keychain \
            -p "build-password" \
            build.keychain-db

          security set-keychain-settings \
            -lut 21600 \
            build.keychain-db

          security import distribution.p12 \
            -k build.keychain-db \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "build-password" \
            build.keychain-db

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          echo "$PROFILE_BASE64" | base64 --decode > Q8Basket.mobileprovision

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          PROFILE_UUID=$(
            security cms -D -i Q8Basket.mobileprovision |
            /usr/libexec/PlistBuddy -c "Print :UUID"
          )

          PROFILE_NAME=$(
            security cms -D -i Q8Basket.mobileprovision |
            /usr/libexec/PlistBuddy -c "Print :Name"
          )

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

          cp Q8Basket.mobileprovision \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "Provisioning Profile Name: $PROFILE_NAME"
          echo "Provisioning Profile UUID: $PROFILE_UUID"

      - name: Check Xcode workspace
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -list

      - name: Build iOS Archive
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$GITHUB_WORKSPACE/build/Q8Basket.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            archive

      - name: Create ExportOptions.plist
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>${DEVELOPMENT_TEAM}</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>${BUNDLE_ID}</key>
                  <string>${PROFILE_NAME}</string>
              </dict>

              <key>compileBitcode</key>
              <false/>

              <key>destination</key>
              <string>export</string>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        run: |
          mkdir -p build/ipa

          xcodebuild \
            -exportArchive \
            -archivePath "$GITHUB_WORKSPACE/build/Q8Basket.xcarchive" \
            -exportPath "$GITHUB_WORKSPACE/build/ipa" \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Q8Basket-iOS-IPA
          path: build/ipa/*.ipa
          if-no-files-found: error

      - name: Upload iOS Archive
        uses: actions/upload-artifact@v4
        with:
          name: Q8Basket-iOS-Archive
          path: build/Q8Basket.xcarchive

      - name: Cleanup signing files
        if: always()
        run: |
          security delete-keychain build.keychain-db || true
          rm -f distribution.p12
          rm -f Q8Basket.mobileprovision
          rm -f ExportOptions.plist
