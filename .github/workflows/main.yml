name: Q8Basket iOS Build

on:
  workflow_dispatch:

jobs:
  ios-build:
    runs-on: macos-latest

    env:
      VITE_API_BASE_URL: "https://admin.q8basket.com/api"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        run: |
          cd ios/App
          pod install

      - name: Check Xcode workspace
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -list

      - name: Check Xcode project
        run: |
          xcodebuild -project ios/App/App.xcodeproj -list

      - name: Upload iOS build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            ~/Library/Logs/DiagnosticReports/*
