name: Build Q8Basket iOS

on:
  workflow_dispatch:

jobs:
  ios-build:
    name: Build Q8Basket iOS
    runs-on: macos-latest

    env:
      VITE_API_BASE_URL: https://admin.q8basket.com/api

      DEVELOPMENT_TEAM: 5J9VJRYZMN
      BUNDLE_ID: com.q8basket.app

      APP_NAME: Q8Basket
      SCHEME_NAME: Q8Basket
      TARGET_NAME: Q8Basket

      PROFILE_NAME: Q8Basket AppStore Distribution

      XCODE_CONTAINER: workspace

      # Keychain password is generated during the build.
      # No KEYCHAIN_PASSWORD GitHub secret is required.
      KEYCHAIN_PATH: ${{ runner.temp }}/q8basket-build.keychain-db

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout code
        uses: actions/checkout@v4


      # ============================================================
      # 2. SETUP NODE
      # ============================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm


      # ============================================================
      # 3. INSTALL NPM DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          set -e

          echo "Installing npm dependencies..."

          npm ci


      # ============================================================
      # 4. BUILD WEB APP
      # ============================================================

      - name: Build web app
        env:
          VITE_API_BASE_URL: https://admin.q8basket.com/api
        run: |
          set -e

          echo "======================================"
          echo "BUILDING WEB APP"
          echo "======================================"

          npm run build

          echo "Web build completed."

          if [ ! -d "dist" ]; then
            echo "ERROR: dist folder was not created."
            exit 1
          fi

          ls -lah dist


      # ============================================================
      # 5. CAPACITOR IOS SYNC
      # ============================================================

      - name: Sync Capacitor iOS
        run: |
          set -e

          echo "======================================"
          echo "SYNCING CAPACITOR IOS"
          echo "======================================"

          npx cap sync ios


      # ============================================================
      # 6. INSTALL COCOAPODS
      # ============================================================

      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: |
          set -e

          echo "======================================"
          echo "INSTALLING COCOAPODS"
          echo "======================================"

          pod install --repo-update

          if [ ! -f "App.xcworkspace/contents.xcworkspacedata" ]; then
            echo "ERROR: App.xcworkspace was not created."
            exit 1
          fi

          if [ ! -d "Pods" ]; then
            echo "ERROR: Pods directory was not created."
            exit 1
          fi

          echo "CocoaPods installation completed."


      # ============================================================
      # 7. CREATE SIGNING KEYCHAIN
      # ============================================================

      - name: Create signing keychain
        shell: bash
        run: |
          set -e

          KEYCHAIN_PATH="$RUNNER_TEMP/q8basket-build.keychain-db"

          # Generate a temporary password.
          # No GitHub KEYCHAIN_PASSWORD secret is required.
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

          echo "Creating temporary keychain..."

          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          # Make sure the temporary keychain is available.
          security list-keychains -d user -s \
            "$KEYCHAIN_PATH" \
            "$HOME/Library/Keychains/login.keychain-db"

          security default-keychain -s "$KEYCHAIN_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          echo "Keychain created successfully."


      # ============================================================
      # 8. DECODE P12
      # ============================================================

      - name: Decode P12 certificate
        shell: bash
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -e

          echo "======================================"
          echo "DECODING P12"
          echo "======================================"

          P12_PATH="$RUNNER_TEMP/distribution.p12"

          if [ -z "$P12_BASE64" ]; then
            echo "ERROR: P12_BASE64 secret is empty."
            exit 1
          fi

          if [ -z "$P12_PASSWORD" ]; then
            echo "ERROR: P12_PASSWORD secret is empty."
            exit 1
          fi

          printf '%s' "$P12_BASE64" \
            | base64 --decode > "$P12_PATH"

          if [ ! -s "$P12_PATH" ]; then
            echo "ERROR: distribution.p12 is empty."
            exit 1
          fi

          echo "P12 created:"
          ls -lh "$P12_PATH"

          echo "P12_PATH=$P12_PATH" >> "$GITHUB_ENV"


      # ============================================================
      # 9. VERIFY P12 PASSWORD
      # ============================================================

      - name: Verify P12 password
        shell: bash
        env:
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -e

          echo "======================================"
          echo "VERIFYING P12"
          echo "======================================"

          openssl pkcs12 \
            -info \
            -in "$P12_PATH" \
            -noout \
            -passin env:P12_PASSWORD \
            -legacy

          echo "P12 password verification successful."


      # ============================================================
      # 10. IMPORT P12 INTO KEYCHAIN
      # ============================================================

      - name: Install signing certificate
        shell: bash
        env:
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -e

          echo "======================================"
          echo "INSTALLING SIGNING CERTIFICATE"
          echo "======================================"

          security import "$P12_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          echo "Signing certificate installed."

          echo "Available signing identities:"

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"


      # ============================================================
      # 11. DECODE PROVISIONING PROFILE
      # ============================================================

      - name: Decode provisioning profile
        shell: bash
        env:
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -e

          echo "======================================"
          echo "DECODING PROVISIONING PROFILE"
          echo "======================================"

          PROFILE_PATH="$RUNNER_TEMP/Q8Basket_AppStore_Distribution.mobileprovision"

          if [ -z "$IOS_PROVISION_PROFILE_BASE64" ]; then
            echo "ERROR: IOS_PROVISION_PROFILE_BASE64 secret is empty."
            exit 1
          fi

          printf '%s' "$IOS_PROVISION_PROFILE_BASE64" \
            | base64 --decode > "$PROFILE_PATH"

          if [ ! -s "$PROFILE_PATH" ]; then
            echo "ERROR: Provisioning profile is empty."
            exit 1
          fi

          echo "PROFILE_PATH=$PROFILE_PATH" >> "$GITHUB_ENV"

          ls -lh "$PROFILE_PATH"


      # ============================================================
      # 12. INSTALL PROVISIONING PROFILE
      # ============================================================

      - name: Install provisioning profile
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "INSTALLING PROVISIONING PROFILE"
          echo "======================================"

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          mkdir -p "$PROFILE_DIR"

          # Read UUID from provisioning profile.
          PROFILE_UUID="$(
            security cms -D -i "$PROFILE_PATH" \
              | plutil -extract UUID raw -
          )"

          if [ -z "$PROFILE_UUID" ]; then
            echo "ERROR: Could not read provisioning profile UUID."
            exit 1
          fi

          cp "$PROFILE_PATH" \
            "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

          echo "Provisioning profile installed:"
          echo "$PROFILE_UUID"


      # ============================================================
      # 13. READ PROVISIONING PROFILE
      # ============================================================

      - name: Read provisioning profile
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "PROVISIONING PROFILE INFORMATION"
          echo "======================================"

          security cms \
            -D \
            -i "$PROFILE_PATH" \
            > "$RUNNER_TEMP/profile.plist"

          echo "Name:"
          /usr/libexec/PlistBuddy \
            -c "Print :Name" \
            "$RUNNER_TEMP/profile.plist"

          echo "UUID:"
          /usr/libexec/PlistBuddy \
            -c "Print :UUID" \
            "$RUNNER_TEMP/profile.plist"

          echo "Team:"
          /usr/libexec/PlistBuddy \
            -c "Print :TeamIdentifier:0" \
            "$RUNNER_TEMP/profile.plist"

          echo "Bundle ID:"
          /usr/libexec/PlistBuddy \
            -c "Print :Entitlements:application-identifier" \
            "$RUNNER_TEMP/profile.plist"


      # ============================================================
      # 14. CHECK XCODE PROJECT
      # ============================================================

      - name: Check Xcode project
        working-directory: ios/App
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "CHECKING XCODE PROJECT"
          echo "======================================"

          xcodebuild \
            -project App.xcodeproj \
            -list

          echo ""
          echo "Workspace:"
          xcodebuild \
            -workspace App.xcworkspace \
            -list


      # ============================================================
      # 15. INSTALL XCODEPROJ GEM
      # ============================================================

      - name: Install xcodeproj gem
        run: |
          set -e

          echo "Installing xcodeproj..."

          gem install xcodeproj --no-document

          ruby -e "require 'xcodeproj'; puts Xcodeproj::VERSION"


      # ============================================================
      # 16. FIX APP + PODS SIGNING
      # ============================================================

      - name: Configure iOS code signing
        working-directory: ios/App
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "CONFIGURING IOS CODE SIGNING"
          echo "======================================"

          ruby <<'RUBY'

          require 'xcodeproj'

          development_team = ENV['DEVELOPMENT_TEAM']
          bundle_id = ENV['BUNDLE_ID']
          profile_name = ENV['PROFILE_NAME']

          app_project_path = 'App.xcodeproj'
          pods_project_path = 'Pods/Pods.xcodeproj'

          puts ""
          puts "======================================"
          puts "CONFIGURING APP PROJECT"
          puts "======================================"

          app_project = Xcodeproj::Project.open(app_project_path)

          app_target = app_project.targets.find do |target|
            target.name == 'Q8Basket'
          end

          unless app_target
            abort "ERROR: Q8Basket target was not found."
          end

          puts "Found target: #{app_target.name}"

          app_target.build_configurations.each do |config|

            if config.name == 'Release'

              settings = config.build_settings

              settings['CODE_SIGN_STYLE'] = 'Manual'
              settings['DEVELOPMENT_TEAM'] = development_team
              settings['PRODUCT_BUNDLE_IDENTIFIER'] = bundle_id
              settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
              settings['PROVISIONING_PROFILE_SPECIFIER'] = profile_name

              puts ""
              puts "Q8Basket Release signing:"
              puts "CODE_SIGN_STYLE = #{settings['CODE_SIGN_STYLE']}"
              puts "DEVELOPMENT_TEAM = #{settings['DEVELOPMENT_TEAM']}"
              puts "PRODUCT_BUNDLE_IDENTIFIER = #{settings['PRODUCT_BUNDLE_IDENTIFIER']}"
              puts "CODE_SIGN_IDENTITY = #{settings['CODE_SIGN_IDENTITY']}"
              puts "PROVISIONING_PROFILE_SPECIFIER = #{settings['PROVISIONING_PROFILE_SPECIFIER']}"

            end

          end

          app_project.save

          puts ""
          puts "======================================"
          puts "CONFIGURING PODS"
          puts "======================================"

          unless File.exist?(pods_project_path)
            abort "ERROR: Pods.xcodeproj not found."
          end

          pods_project = Xcodeproj::Project.open(pods_project_path)

          pods_project.targets.each do |target|

            target.build_configurations.each do |config|

              settings = config.build_settings

              # ----------------------------------------------------
              # IMPORTANT
              #
              # CocoaPods targets must NOT use the application's
              # provisioning profile.
              # ----------------------------------------------------

              settings['CODE_SIGN_STYLE'] = 'Automatic'

              settings['PROVISIONING_PROFILE_SPECIFIER'] = ''
              settings['PROVISIONING_PROFILE'] = ''

              settings['CODE_SIGN_IDENTITY'] = ''

              settings['CODE_SIGNING_ALLOWED'] = 'NO'
              settings['CODE_SIGNING_REQUIRED'] = 'NO'

            end

            puts "Disabled signing for Pod: #{target.name}"

          end

          pods_project.save

          puts ""
          puts "======================================"
          puts "SIGNING CONFIGURATION COMPLETE"
          puts "======================================"

          RUBY


      # ============================================================
      # 17. VERIFY Q8BASKET SCHEME
      # ============================================================

      - name: Verify Q8Basket scheme
        working-directory: ios/App
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "VERIFYING Q8BASKET SCHEME"
          echo "======================================"

          xcodebuild \
            -workspace App.xcworkspace \
            -list

          echo ""
          echo "Checking scheme..."

          xcodebuild \
            -workspace App.xcworkspace \
            -scheme Q8Basket \
            -showBuildSettings \
            -configuration Release \
            > "$RUNNER_TEMP/q8basket-build-settings.txt"

          grep -E \
            "PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE_SPECIFIER" \
            "$RUNNER_TEMP/q8basket-build-settings.txt" \
            || true

          echo ""
          echo "Q8Basket scheme verification completed."


      # ============================================================
      # 18. BUILD IOS ARCHIVE
      # ============================================================

      - name: Build iOS Archive
        working-directory: ios/App
        shell: bash
        run: |
          set -e

          ARCHIVE_PATH="$RUNNER_TEMP/Q8Basket.xcarchive"

          echo "======================================"
          echo "BUILDING Q8BASKET ARCHIVE"
          echo "======================================"

          echo "Workspace: App.xcworkspace"
          echo "Scheme: Q8Basket"
          echo "Configuration: Release"
          echo "Bundle ID: $BUNDLE_ID"
          echo "Team: $DEVELOPMENT_TEAM"

          # IMPORTANT:
          #
          # DO NOT pass:
          # CODE_SIGN_STYLE
          # CODE_SIGN_IDENTITY
          # PROVISIONING_PROFILE_SPECIFIER
          #
          # on the xcodebuild command line.
          #
          # Those values previously propagated to CocoaPods.
          # The app and Pods are now configured separately above.

          xcodebuild \
            -workspace App.xcworkspace \
            -scheme Q8Basket \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            clean archive

          echo ""
          echo "======================================"
          echo "ARCHIVE CREATED"
          echo "======================================"

          if [ ! -d "$ARCHIVE_PATH" ]; then
            echo "ERROR: Archive was not created."
            exit 1
          fi

          ls -lah "$ARCHIVE_PATH"

          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"


      # ============================================================
      # 19. CHECK ARCHIVE
      # ============================================================

      - name: Check Archive
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "CHECKING ARCHIVE"
          echo "======================================"

          if [ ! -d "$ARCHIVE_PATH" ]; then
            echo "ERROR: Archive does not exist."
            exit 1
          fi

          if [ ! -f "$ARCHIVE_PATH/Info.plist" ]; then
            echo "ERROR: Archive Info.plist not found."
            exit 1
          fi

          echo "Archive:"
          ls -lah "$ARCHIVE_PATH"

          echo ""
          echo "Archive application:"
          find "$ARCHIVE_PATH/Products/Applications" \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            -print


      # ============================================================
      # 20. CREATE EXPORT OPTIONS
      # ============================================================

      - name: Create ExportOptions.plist
        shell: bash
        run: |
          set -e

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>

            <key>method</key>
            <string>app-store</string>

            <key>destination</key>
            <string>export</string>

            <key>signingStyle</key>
            <string>manual</string>

            <key>teamID</key>
            <string>5J9VJRYZMN</string>

            <key>provisioningProfiles</key>
            <dict>
              <key>com.q8basket.app</key>
              <string>Q8Basket AppStore Distribution</string>
            </dict>

            <key>stripSwiftSymbols</key>
            <true/>

            <key>compileBitcode</key>
            <false/>

          </dict>
          </plist>
          EOF

          echo "ExportOptions.plist created."

          cat "$RUNNER_TEMP/ExportOptions.plist"


      # ============================================================
      # 21. EXPORT IPA
      # ============================================================

      - name: Export IPA
        shell: bash
        run: |
          set -e

          EXPORT_PATH="$RUNNER_TEMP/export"

          rm -rf "$EXPORT_PATH"

          mkdir -p "$EXPORT_PATH"

          echo "======================================"
          echo "EXPORTING IPA"
          echo "======================================"

          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

          echo ""
          echo "======================================"
          echo "IPA EXPORT COMPLETE"
          echo "======================================"

          find "$EXPORT_PATH" \
            -maxdepth 2 \
            -type f \
            -print

          IPA_FILE="$(find "$EXPORT_PATH" -maxdepth 1 -name "*.ipa" -print -quit)"

          if [ -z "$IPA_FILE" ]; then
            echo "ERROR: IPA was not generated."
            exit 1
          fi

          echo "IPA_FILE=$IPA_FILE" >> "$GITHUB_ENV"

          ls -lh "$IPA_FILE"


      # ============================================================
      # 22. CHECK IPA
      # ============================================================

      - name: Check IPA
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "CHECKING IPA"
          echo "======================================"

          if [ ! -f "$IPA_FILE" ]; then
            echo "ERROR: IPA file does not exist."
            exit 1
          fi

          echo "IPA:"
          ls -lh "$IPA_FILE"

          echo ""
          echo "IPA contents:"

          unzip -l "$IPA_FILE" \
            | grep -E "Payload/.*\.app/" \
            | head -20 \
            || true


      # ============================================================
      # 23. UPLOAD IPA
      # ============================================================

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Q8Basket-iOS-IPA
          path: ${{ env.IPA_FILE }}
          if-no-files-found: error


      # ============================================================
      # 24. UPLOAD ARCHIVE
      # ============================================================

      - name: Upload iOS Archive
        uses: actions/upload-artifact@v4
        with:
          name: Q8Basket-iOS-Archive
          path: ${{ env.ARCHIVE_PATH }}
          if-no-files-found: error


      # ============================================================
      # 25. CLEANUP
      # ============================================================

      - name: Cleanup signing files
        if: always()
        shell: bash
        run: |
          set +e

          echo "Cleaning temporary signing files..."

          security delete-keychain \
            "$KEYCHAIN_PATH" \
            2>/dev/null || true

          rm -f "$P12_PATH" 2>/dev/null || true

          rm -f "$PROFILE_PATH" 2>/dev/null || true

          rm -f "$RUNNER_TEMP/profile.plist" 2>/dev/null || true

          rm -f "$RUNNER_TEMP/ExportOptions.plist" 2>/dev/null || true

          echo "Cleanup completed."
