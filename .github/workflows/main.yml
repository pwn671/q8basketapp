name: Build Q8Basket iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  ios-build:
    name: Build Q8Basket iOS
    runs-on: macos-latest

    env:
      VITE_API_BASE_URL: https://admin.q8basket.com/api

      DEVELOPMENT_TEAM: 5J9VJRYZMN
      BUNDLE_ID: com.q8basket.app

      APP_NAME: Q8Basket
      SCHEME_NAME: Q8Basket
      TARGET_NAME: Q8Basket

      PROFILE_NAME: Q8Basket AppStore Distribution

      P12_BASE64: ${{ secrets.P12_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout code
        uses: actions/checkout@v4

      # ============================================================
      # 2. SETUP NODE
      # ============================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ============================================================
      # 3. INSTALL DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          set -e

          echo "Installing npm dependencies..."

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # ============================================================
      # 4. BUILD WEB APP
      # ============================================================

      - name: Build web app
        run: |
          set -e

          echo "Building Vite application..."

          npm run build

          echo "Build completed."

          if [ ! -d "dist" ]; then
            echo "ERROR: dist directory was not created."
            exit 1
          fi

          ls -lah dist

      # ============================================================
      # 5. CAPACITOR SYNC
      # ============================================================

      - name: Sync Capacitor iOS
        run: |
          set -e

          echo "Syncing Capacitor iOS..."

          npx cap sync ios

          echo "Capacitor iOS sync completed."

          ls -lah ios

      # ============================================================
      # 6. INSTALL COCOAPODS
      # ============================================================

      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: |
          set -e

          echo "Installing CocoaPods..."

          if [ -f Podfile ]; then
            pod install --repo-update
          else
            echo "No Podfile found."
          fi

      # ============================================================
      # 7. FIND XCODE PROJECT
      # ============================================================

      - name: Find Xcode project
        working-directory: ios/App
        run: |
          set -e

          echo "======================================"
          echo "XCODE FILES"
          echo "======================================"

          find . -maxdepth 2 \
            \( -name "*.xcodeproj" -o -name "*.xcworkspace" \) \
            -print

          echo "======================================"

          if [ -f "App.xcworkspace/contents.xcworkspacedata" ]; then
            echo "Using App.xcworkspace"
            echo "XCODE_CONTAINER=workspace" >> "$GITHUB_ENV"
          elif [ -d "App.xcodeproj" ]; then
            echo "Using App.xcodeproj"
            echo "XCODE_CONTAINER=project" >> "$GITHUB_ENV"
          else
            echo "ERROR: App.xcodeproj or App.xcworkspace not found."
            exit 1
          fi

      # ============================================================
      # 8. SHOW XCODE TARGETS AND SCHEMES
      # ============================================================

      - name: Check Xcode project
        working-directory: ios/App
        run: |
          set -e

          echo "======================================"
          echo "XCODE PROJECT INFORMATION"
          echo "======================================"

          if [ "$XCODE_CONTAINER" = "workspace" ]; then

            xcodebuild \
              -workspace App.xcworkspace \
              -list

          else

            xcodebuild \
              -project App.xcodeproj \
              -list

          fi

          echo "======================================"

      # ============================================================
      # 9. DECODE P12
      # ============================================================

      - name: Decode P12
        shell: bash
        run: |
          set -e

          echo "Decoding P12..."

          if [ -z "$P12_BASE64" ]; then
            echo "ERROR: P12_BASE64 secret is empty."
            exit 1
          fi

          printf '%s' "$P12_BASE64" \
            | openssl base64 -A -d \
            > "$RUNNER_TEMP/distribution.p12"

          echo "P12 created:"
          ls -lh "$RUNNER_TEMP/distribution.p12"

          FILE_SIZE=$(stat -f%z "$RUNNER_TEMP/distribution.p12")

          echo "P12 size: $FILE_SIZE bytes"

          if [ "$FILE_SIZE" -lt 1000 ]; then
            echo "ERROR: P12 file is too small."
            exit 1
          fi

      # ============================================================
      # 10. VERIFY P12 PASSWORD
      # ============================================================

      - name: Verify P12
        shell: bash
        run: |
          set -e

          echo "Verifying P12..."

          if [ -z "$P12_PASSWORD" ]; then
            echo "ERROR: P12_PASSWORD secret is empty."
            exit 1
          fi

          openssl pkcs12 \
            -info \
            -in "$RUNNER_TEMP/distribution.p12" \
            -noout \
            -passin pass:"$P12_PASSWORD" \
            -legacy

          echo "======================================"
          echo "P12 verification successful."
          echo "======================================"

      # ============================================================
      # 11. CREATE TEMP KEYCHAIN
      # ============================================================

      - name: Create signing keychain
        shell: bash
        run: |
          set -e

          KEYCHAIN_PATH="$RUNNER_TEMP/q8basket-build.keychain-db"

          # This password is ONLY for the temporary CI keychain.
          # It is NOT a GitHub Secret.
          KEYCHAIN_PASSWORD="q8basket-ci-keychain"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

          rm -f "$KEYCHAIN_PATH"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH"

          security default-keychain \
            -s "$KEYCHAIN_PATH"

          echo "Temporary keychain created."

      # ============================================================
      # 12. IMPORT APPLE DISTRIBUTION CERTIFICATE
      # ============================================================

      - name: Install signing certificate
        shell: bash
        run: |
          set -e

          echo "Importing Apple Distribution certificate..."

          security import "$RUNNER_TEMP/distribution.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          echo "Certificate imported."

          echo "======================================"
          echo "Available signing identities"
          echo "======================================"

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"

          echo "======================================"

      # ============================================================
      # 13. CREATE PROVISIONING PROFILE
      # ============================================================

      - name: Decode provisioning profile
        shell: bash
        run: |
          set -e

          echo "Decoding provisioning profile..."

          if [ -z "$IOS_PROVISION_PROFILE_BASE64" ]; then
            echo "ERROR: IOS_PROVISION_PROFILE_BASE64 secret is empty."
            exit 1
          fi

          PROFILE_PATH="$RUNNER_TEMP/Q8Basket_AppStore_Distribution.mobileprovision"

          printf '%s' "$IOS_PROVISION_PROFILE_BASE64" \
            | openssl base64 -A -d \
            > "$PROFILE_PATH"

          echo "Provisioning profile:"
          ls -lh "$PROFILE_PATH"

          PROFILE_SIZE=$(stat -f%z "$PROFILE_PATH")

          if [ "$PROFILE_SIZE" -lt 1000 ]; then
            echo "ERROR: Provisioning profile is invalid or empty."
            exit 1
          fi

          echo "PROFILE_PATH=$PROFILE_PATH" >> "$GITHUB_ENV"

      # ============================================================
      # 14. READ PROVISIONING PROFILE
      # ============================================================

      - name: Read provisioning profile
        shell: bash
        run: |
          set -e

          echo "Reading provisioning profile..."

          security cms \
            -D \
            -i "$PROFILE_PATH" \
            > "$RUNNER_TEMP/profile.plist"

          echo "======================================"
          echo "PROFILE NAME"
          echo "======================================"

          /usr/libexec/PlistBuddy \
            -c "Print :Name" \
            "$RUNNER_TEMP/profile.plist"

          echo "======================================"
          echo "APP ID"
          echo "======================================"

          /usr/libexec/PlistBuddy \
            -c "Print :Entitlements:application-identifier" \
            "$RUNNER_TEMP/profile.plist"

          echo "======================================"
          echo "TEAM ID"
          echo "======================================"

          /usr/libexec/PlistBuddy \
            -c "Print :TeamIdentifier:0" \
            "$RUNNER_TEMP/profile.plist" || true

          echo "======================================"
          echo "UUID"
          echo "======================================"

          PROFILE_UUID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :UUID" \
              "$RUNNER_TEMP/profile.plist"
          )

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

          echo "Provisioning profile UUID: $PROFILE_UUID"

      # ============================================================
      # 15. CHECK BUNDLE ID
      # ============================================================

      - name: Validate provisioning profile
        shell: bash
        run: |
          set -e

          echo "Validating provisioning profile..."

          PROFILE_APP_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:application-identifier" \
              "$RUNNER_TEMP/profile.plist"
          )

          EXPECTED_APP_ID="$DEVELOPMENT_TEAM.$BUNDLE_ID"

          echo "Profile App ID : $PROFILE_APP_ID"
          echo "Expected App ID: $EXPECTED_APP_ID"

          if [ "$PROFILE_APP_ID" != "$EXPECTED_APP_ID" ]; then
            echo ""
            echo "ERROR: Provisioning profile does not match bundle ID."
            echo ""
            echo "Expected:"
            echo "$EXPECTED_APP_ID"
            echo ""
            echo "Got:"
            echo "$PROFILE_APP_ID"
            exit 1
          fi

          echo "Provisioning profile matches bundle ID."

      # ============================================================
      # 16. INSTALL PROVISIONING PROFILE
      # ============================================================

      - name: Install provisioning profile
        shell: bash
        run: |
          set -e

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          mkdir -p "$PROFILE_DIR"

          cp "$PROFILE_PATH" \
            "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"

          echo "Provisioning profile installed."

          ls -lah "$PROFILE_DIR"

      # ============================================================
      # 17. VERIFY XCODE SCHEME
      # ============================================================

      - name: Verify Q8Basket scheme
        working-directory: ios/App
        shell: bash
        run: |
          set -e

          echo "Checking Q8Basket scheme..."

          if [ "$XCODE_CONTAINER" = "workspace" ]; then

            xcodebuild \
              -workspace App.xcworkspace \
              -list

          else

            xcodebuild \
              -project App.xcodeproj \
              -list

          fi

          echo "Expected scheme: $SCHEME_NAME"
          echo "Expected target: $TARGET_NAME"

      # ============================================================
      # 18. CREATE EXPORT OPTIONS
      # ============================================================

      - name: Create ExportOptions.plist
        shell: bash
        run: |
          set -e

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>${DEVELOPMENT_TEAM}</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>${BUNDLE_ID}</key>
                  <string>${PROFILE_NAME}</string>
              </dict>

              <key>destination</key>
              <string>export</string>

              <key>uploadSymbols</key>
              <true/>

              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

          echo "ExportOptions.plist created."

          cat "$RUNNER_TEMP/ExportOptions.plist"

      # ============================================================
      # 19. BUILD ARCHIVE
      # ============================================================

      - name: Build iOS Archive
        working-directory: ios/App
        shell: bash
        run: |
          set -e

          ARCHIVE_PATH="$RUNNER_TEMP/Q8Basket.xcarchive"

          echo "======================================"
          echo "BUILDING Q8BASKET ARCHIVE"
          echo "======================================"

          if [ "$XCODE_CONTAINER" = "workspace" ]; then

            xcodebuild \
              -workspace App.xcworkspace \
              -scheme "$SCHEME_NAME" \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath "$ARCHIVE_PATH" \
              DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
              PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="Apple Distribution" \
              PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
              clean archive

          else

            xcodebuild \
              -project App.xcodeproj \
              -scheme "$SCHEME_NAME" \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath "$ARCHIVE_PATH" \
              DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
              PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="Apple Distribution" \
              PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
              clean archive

          fi

          echo "======================================"
          echo "ARCHIVE CREATED"
          echo "======================================"

          ls -lah "$ARCHIVE_PATH"

          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"

      # ============================================================
      # 20. VERIFY ARCHIVE
      # ============================================================

      - name: Check Archive
        shell: bash
        run: |
          set -e

          echo "Checking archive..."

          if [ ! -d "$ARCHIVE_PATH" ]; then
            echo "ERROR: Archive was not created."
            exit 1
          fi

          if [ ! -f "$ARCHIVE_PATH/Info.plist" ]; then
            echo "ERROR: Archive Info.plist missing."
            exit 1
          fi

          echo "Archive is valid."

      # ============================================================
      # 21. EXPORT IPA
      # ============================================================

      - name: Export IPA
        shell: bash
        run: |
          set -e

          EXPORT_DIR="$RUNNER_TEMP/export"

          rm -rf "$EXPORT_DIR"
          mkdir -p "$EXPORT_DIR"

          echo "Exporting IPA..."

          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

          echo "======================================"
          echo "EXPORT COMPLETE"
          echo "======================================"

          find "$EXPORT_DIR" \
            -maxdepth 2 \
            -type f \
            -print

      # ============================================================
      # 22. FIND IPA
      # ============================================================

      - name: Check IPA
        shell: bash
        run: |
          set -e

          IPA_FILE=$(find "$RUNNER_TEMP/export" -type f -name "*.ipa" | head -n 1)

          if [ -z "$IPA_FILE" ]; then
            echo "ERROR: IPA was not generated."
            exit 1
          fi

          echo "IPA found:"
          echo "$IPA_FILE"

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          cp "$IPA_FILE" \
            "$GITHUB_WORKSPACE/artifacts/Q8Basket.ipa"

          echo "IPA copied to artifacts."

          ls -lh "$GITHUB_WORKSPACE/artifacts/Q8Basket.ipa"

      # ============================================================
      # 23. UPLOAD IPA
      # ============================================================

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Q8Basket-iOS-IPA
          path: artifacts/Q8Basket.ipa
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # 24. UPLOAD ARCHIVE
      # ============================================================

      - name: Upload iOS Archive
        uses: actions/upload-artifact@v4
        with:
          name: Q8Basket-iOS-Archive
          path: ${{ env.ARCHIVE_PATH }}
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # 25. CLEANUP KEYCHAIN
      # ============================================================

      - name: Cleanup signing files
        if: always()
        shell: bash
        run: |
          echo "Cleaning temporary signing files..."

          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

          rm -f "${RUNNER_TEMP}/distribution.p12" || true
          rm -f "${RUNNER_TEMP}/Q8Basket_AppStore_Distribution.mobileprovision" || true
          rm -f "${RUNNER_TEMP}/profile.plist" || true
          rm -f "${RUNNER_TEMP}/ExportOptions.plist" || true

          echo "Cleanup completed."
