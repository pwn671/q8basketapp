name: Q8Basket iOS Build

on:
  workflow_dispatch:

jobs:
  ios-build:
    runs-on: macos-latest

    env:
      VITE_API_BASE_URL: "https://admin.q8basket.com/api"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        run: |
          cd ios/App
          pod install

      - name: Check Xcode workspace
        run: |
          echo "===== XCODE WORKSPACE ====="
          xcodebuild -workspace ios/App/App.xcworkspace -list

      - name: Check Xcode project
        run: |
          echo "===== XCODE PROJECT ====="
          xcodebuild -project ios/App/App.xcodeproj -list

      - name: Find iOS Scheme
        id: scheme
        run: |
          echo "Finding available Xcode schemes..."

          SCHEME=$(xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -list |
            awk '
              /Schemes:/ {
                found=1
                next
              }
              found && NF {
                print $1
                exit
              }
            ')

          if [ -z "$SCHEME" ]; then
            echo "ERROR: No Xcode scheme found."
            exit 1
          fi

          echo "Found scheme: $SCHEME"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Build iOS Archive
        run: |
          echo "Building archive using scheme: ${{ steps.scheme.outputs.scheme }}"

          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme "${{ steps.scheme.outputs.scheme }}" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/Q8Basket.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Check Archive
        run: |
          if [ -d "build/Q8Basket.xcarchive" ]; then
            echo "iOS Archive created successfully."
            ls -la build/Q8Basket.xcarchive
          else
            echo "ERROR: iOS Archive was not created."
            exit 1
          fi

      - name: Upload iOS Archive
        uses: actions/upload-artifact@v4
        with:
          name: Q8Basket-iOS-Archive
          path: build/Q8Basket.xcarchive

      - name: Upload iOS build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: ~/Library/Logs/DiagnosticReports/*
