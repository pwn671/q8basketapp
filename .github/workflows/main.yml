name: Q8Basket iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ios-build:
    name: Build Q8Basket iOS
    runs-on: macos-latest

    env:
      VITE_API_BASE_URL: https://admin.q8basket.com/api
      DEVELOPMENT_TEAM: 5J9VJRYZMN
      BUNDLE_ID: com.q8basket.app

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout code
        uses: actions/checkout@v4


      # =========================================================
      # 2. NODE
      # =========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm


      # =========================================================
      # 3. INSTALL NPM DEPENDENCIES
      # =========================================================
      - name: Install dependencies
        run: npm ci


      # =========================================================
      # 4. BUILD WEB APP
      # =========================================================
      - name: Build web app
        run: npm run build


      # =========================================================
      # 5. SYNC CAPACITOR IOS
      # =========================================================
      - name: Sync Capacitor iOS
        run: npx cap sync ios


      # =========================================================
      # 6. INSTALL COCOAPODS
      # =========================================================
      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: |
          pod install --repo-update


      # =========================================================
      # 7. CREATE TEMP KEYCHAIN
      # =========================================================
      - name: Create signing keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH"

          security default-keychain -s "$KEYCHAIN_PATH"


      # =========================================================
      # 8. DECODE P12
      # =========================================================
      - name: Decode P12 certificate
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
        run: |
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"

          echo "Checking P12 file..."

          ls -lh "$RUNNER_TEMP/distribution.p12"

          file "$RUNNER_TEMP/distribution.p12"


      # =========================================================
      # 9. IMPORT P12
      # =========================================================
      - name: Install signing certificate
        env:
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"

          security import "$RUNNER_TEMP/distribution.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          echo "Installed signing identities:"

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"


      # =========================================================
      # 10. DECODE PROVISIONING PROFILE
      # =========================================================
      - name: Install provisioning profile
        env:
          PROVISION_PROFILE_BASE64: ${{ secrets.PROVISION_PROFILE_BASE64 }}
        run: |
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          mkdir -p "$PROFILE_DIR"

          echo "$PROVISION_PROFILE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/Q8Basket.mobileprovision"

          echo "Reading provisioning profile..."

          security cms \
            -D \
            -i "$RUNNER_TEMP/Q8Basket.mobileprovision" \
            > "$RUNNER_TEMP/profile.plist"

          PROFILE_UUID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :UUID" \
              "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_NAME=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Name" \
              "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_APP_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:application-identifier" \
              "$RUNNER_TEMP/profile.plist"
          )

          echo "Profile UUID: $PROFILE_UUID"
          echo "Profile Name: $PROFILE_NAME"
          echo "Profile App ID: $PROFILE_APP_ID"

          cp \
            "$RUNNER_TEMP/Q8Basket.mobileprovision" \
            "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"


      # =========================================================
      # 11. VERIFY SIGNING ASSETS
      # =========================================================
      - name: Verify signing assets
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"

          echo "======================================"
          echo "VERIFY SIGNING"
          echo "======================================"

          echo ""
          echo "Code signing identities:"
          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"

          echo ""
          echo "Provisioning profiles:"
          ls -lah \
            "$HOME/Library/MobileDevice/Provisioning Profiles"

          echo ""
          echo "Profile UUID:"
          echo "$PROFILE_UUID"

          echo ""
          echo "Profile Name:"
          echo "$PROFILE_NAME"


      # =========================================================
      # 12. FIX COCOAPODS SIGNING
      #
      # IMPORTANT:
      # Pods must NOT receive the AppStore provisioning profile.
      # Only Q8Basket app target should be manually signed.
      # =========================================================
      - name: Fix CocoaPods code signing
        working-directory: ios/App
        run: |
          ruby <<'RUBY'
          require 'xcodeproj'

          pods_project_path = 'Pods/Pods.xcodeproj'

          project = Xcodeproj::Project.open(pods_project_path)

          project.targets.each do |target|
            target.build_configurations.each do |config|
              config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
              config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
              config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = ''
              config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ''
              config.build_settings['PROVISIONING_PROFILE'] = ''
            end
          end

          project.save

          puts "CocoaPods signing disabled successfully."
          RUBY


      # =========================================================
      # 13. VERIFY XCODE WORKSPACE
      # =========================================================
      - name: Check Xcode workspace
        working-directory: ios/App
        run: |
          echo "======================================"
          echo "XCODE WORKSPACE"
          echo "======================================"

          xcodebuild \
            -workspace App.xcworkspace \
            -list


      # =========================================================
      # 14. VERIFY Q8BASKET SCHEME
      # =========================================================
      - name: Verify Q8Basket scheme
        working-directory: ios/App
        run: |
          echo "======================================"
          echo "CHECKING Q8BASKET SCHEME"
          echo "======================================"

          xcodebuild \
            -workspace App.xcworkspace \
            -scheme Q8Basket \
            -showBuildSettings \
            -configuration Release \
            > "$RUNNER_TEMP/q8basket-build-settings.txt"

          echo "Q8Basket scheme found successfully."

          grep -E \
            "PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE" \
            "$RUNNER_TEMP/q8basket-build-settings.txt" \
            || true


      # =========================================================
      # 15. CREATE ARCHIVE
      #
      # DO NOT PASS PROVISIONING_PROFILE_SPECIFIER HERE.
      #
      # Passing it globally causes Pods to inherit it.
      # =========================================================
      - name: Build iOS Archive
        working-directory: ios/App
        run: |
          echo "======================================"
          echo "BUILDING Q8BASKET IOS ARCHIVE"
          echo "======================================"

          echo "Scheme: Q8Basket"
          echo "Bundle ID: $BUNDLE_ID"
          echo "Team: $DEVELOPMENT_TEAM"
          echo "Profile: $PROFILE_NAME"
          echo "Profile UUID: $PROFILE_UUID"

          rm -rf "$GITHUB_WORKSPACE/build"

          mkdir -p "$GITHUB_WORKSPACE/build"

          xcodebuild \
            -workspace App.xcworkspace \
            -scheme Q8Basket \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$GITHUB_WORKSPACE/build/Q8Basket.xcarchive" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            archive


      # =========================================================
      # 16. CHECK ARCHIVE
      # =========================================================
      - name: Check Archive
        run: |
          echo "======================================"
          echo "CHECKING ARCHIVE"
          echo "======================================"

          if [ ! -d "$GITHUB_WORKSPACE/build/Q8Basket.xcarchive" ]; then
            echo "ERROR: Q8Basket.xcarchive was not created."
            exit 1
          fi

          echo "Archive created successfully."

          ls -lah \
            "$GITHUB_WORKSPACE/build/Q8Basket.xcarchive"


      # =========================================================
      # 17. CREATE EXPORT OPTIONS
      # =========================================================
      - name: Create ExportOptions.plist
        run: |
          cat > "$GITHUB_WORKSPACE/build/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>${DEVELOPMENT_TEAM}</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>${BUNDLE_ID}</key>
                  <string>${PROFILE_NAME}</string>
              </dict>

              <key>destination</key>
              <string>export</string>

              <key>stripSwiftSymbols</key>
              <true/>

              <key>compileBitcode</key>
              <false/>

              <key>manageAppVersionAndBuildNumber</key>
              <false/>
          </dict>
          </plist>
          EOF

          echo "ExportOptions.plist created."

          cat "$GITHUB_WORKSPACE/build/ExportOptions.plist"


      # =========================================================
      # 18. EXPORT IPA
      # =========================================================
      - name: Export IPA
        run: |
          echo "======================================"
          echo "EXPORTING IPA"
          echo "======================================"

          rm -rf "$GITHUB_WORKSPACE/build/export"

          mkdir -p "$GITHUB_WORKSPACE/build/export"

          xcodebuild \
            -exportArchive \
            -archivePath "$GITHUB_WORKSPACE/build/Q8Basket.xcarchive" \
            -exportPath "$GITHUB_WORKSPACE/build/export" \
            -exportOptionsPlist "$GITHUB_WORKSPACE/build/ExportOptions.plist"


      # =========================================================
      # 19. CHECK IPA
      # =========================================================
      - name: Check IPA
        run: |
          echo "======================================"
          echo "CHECKING IPA"
          echo "======================================"

          find "$GITHUB_WORKSPACE/build/export" \
            -maxdepth 2 \
            -type f \
            -print

          IPA_FILE=$(find \
            "$GITHUB_WORKSPACE/build/export" \
            -name "*.ipa" \
            -type f \
            | head -n 1)

          if [ -z "$IPA_FILE" ]; then
            echo "ERROR: IPA file was not created."
            exit 1
          fi

          echo "IPA created:"
          echo "$IPA_FILE"

          ls -lh "$IPA_FILE"


      # =========================================================
      # 20. UPLOAD IPA
      # =========================================================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Q8Basket-iOS-IPA
          path: build/export/*.ipa
          if-no-files-found: error


      # =========================================================
      # 21. UPLOAD ARCHIVE
      # =========================================================
      - name: Upload iOS Archive
        uses: actions/upload-artifact@v4
        with:
          name: Q8Basket-iOS-Archive
          path: build/Q8Basket.xcarchive
          if-no-files-found: error


      # =========================================================
      # 22. CLEANUP
      # =========================================================
      - name: Cleanup signing files
        if: always()
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"

          security delete-keychain "$KEYCHAIN_PATH" || true

          rm -f "$RUNNER_TEMP/distribution.p12"
          rm -f "$RUNNER_TEMP/Q8Basket.mobileprovision"
          rm -f "$RUNNER_TEMP/profile.plist"
          rm -f "$RUNNER_TEMP/q8basket-build-settings.txt"

          rm -f \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision" \
            || true

          echo "Cleanup completed."
