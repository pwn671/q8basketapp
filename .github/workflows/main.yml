name: Q8Basket iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  ios-build:
    runs-on: macos-latest

    env:
      VITE_API_BASE_URL: https://admin.q8basket.com/api
      DEVELOPMENT_TEAM: 5J9VJRYZMN
      BUNDLE_ID: com.q8basket.app

    steps:

      # ---------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Node
      # ---------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ---------------------------------------------------------
      # 3. Install dependencies
      # ---------------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # ---------------------------------------------------------
      # 4. Build React/Vite app
      # ---------------------------------------------------------
      - name: Build web app
        run: npm run build

      # ---------------------------------------------------------
      # 5. Capacitor iOS
      # ---------------------------------------------------------
      - name: Sync Capacitor iOS
        run: npx cap sync ios

      # ---------------------------------------------------------
      # 6. CocoaPods
      # ---------------------------------------------------------
      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: pod install

      # ---------------------------------------------------------
      # 7. Create temporary keychain
      # ---------------------------------------------------------
      - name: Create signing keychain
        run: |
          security create-keychain \
            -p "build-password" \
            build.keychain-db

          security default-keychain \
            -s build.keychain-db

          security unlock-keychain \
            -p "build-password" \
            build.keychain-db

          security set-keychain-settings \
            -lut 21600 \
            build.keychain-db

      # ---------------------------------------------------------
      # 8. Decode P12
      # ---------------------------------------------------------
      - name: Decode P12
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
        run: |
          echo "$P12_BASE64" | base64 --decode > distribution.p12

          echo "Checking P12 file..."
          ls -lh distribution.p12

          file distribution.p12

      # ---------------------------------------------------------
      # 9. Verify P12 password BEFORE importing
      # ---------------------------------------------------------
      - name: Verify P12 password
        env:
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          echo "Verifying P12..."

          openssl pkcs12 \
            -info \
            -in distribution.p12 \
            -noout \
            -passin env:P12_PASSWORD

          echo "P12 password is correct."

      # ---------------------------------------------------------
      # 10. Import P12 into keychain
      # ---------------------------------------------------------
      - name: Install signing certificate
        env:
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          security import distribution.p12 \
            -k build.keychain-db \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "build-password" \
            build.keychain-db

          echo "Installed signing certificate."

          security find-identity \
            -v \
            -p codesigning \
            build.keychain-db

      # ---------------------------------------------------------
      # 11. Decode provisioning profile
      # ---------------------------------------------------------
      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          echo "$PROVISIONING_PROFILE_BASE64" \
            | base64 --decode \
            > "$HOME/Library/MobileDevice/Provisioning Profiles/Q8Basket_AppStore_Distribution.mobileprovision"

          echo "Provisioning profile installed."

          ls -lh "$HOME/Library/MobileDevice/Provisioning Profiles/"

      # ---------------------------------------------------------
      # 12. Read provisioning profile UUID
      # ---------------------------------------------------------
      - name: Get provisioning profile UUID
        id: profile
        run: |
          security cms \
            -D \
            -i "$HOME/Library/MobileDevice/Provisioning Profiles/Q8Basket_AppStore_Distribution.mobileprovision" \
            > profile.plist

          PROFILE_UUID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :UUID" \
              profile.plist
          )

          PROFILE_NAME=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Name" \
              profile.plist
          )

          PROFILE_APP_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:application-identifier" \
              profile.plist
          )

          echo "Profile UUID: $PROFILE_UUID"
          echo "Profile Name: $PROFILE_NAME"
          echo "Profile App ID: $PROFILE_APP_ID"

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_OUTPUT"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # 13. Check Xcode project
      # ---------------------------------------------------------
      - name: Check Xcode workspace
        working-directory: ios/App
        run: |
          echo "Xcode files:"
          ls -la

          echo "Workspace:"
          ls -la *.xcworkspace

      # ---------------------------------------------------------
      # 14. Find scheme
      # ---------------------------------------------------------
      - name: Find iOS Scheme
        working-directory: ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -list

      # ---------------------------------------------------------
      # 15. Create ExportOptions.plist
      # ---------------------------------------------------------
      - name: Create ExportOptions.plist
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>

              <key>destination</key>
              <string>export</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>${DEVELOPMENT_TEAM}</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>${BUNDLE_ID}</key>
                  <string>${{ steps.profile.outputs.PROFILE_NAME }}</string>
              </dict>

              <key>stripSwiftSymbols</key>
              <true/>

              <key>compileBitcode</key>
              <false/>

              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

          cat ExportOptions.plist

      # ---------------------------------------------------------
      # 16. Build Archive
      # ---------------------------------------------------------
      - name: Build iOS Archive
        working-directory: ios/App
        env:
          PROFILE_NAME: ${{ steps.profile.outputs.PROFILE_NAME }}
        run: |
          rm -rf build

          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$GITHUB_WORKSPACE/build/Q8Basket.xcarchive" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            clean archive

      # ---------------------------------------------------------
      # 17. Check Archive
      # ---------------------------------------------------------
      - name: Check Archive
        run: |
          echo "Checking archive..."

          ls -lah build/

          test -d build/Q8Basket.xcarchive

          echo "Archive created successfully."

      # ---------------------------------------------------------
      # 18. Export IPA
      # ---------------------------------------------------------
      - name: Export IPA
        run: |
          rm -rf build/export

          xcodebuild \
            -exportArchive \
            -archivePath build/Q8Basket.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist

      # ---------------------------------------------------------
      # 19. Check IPA
      # ---------------------------------------------------------
      - name: Check IPA
        run: |
          echo "IPA files:"

          find build/export \
            -maxdepth 2 \
            -type f \
            -name "*.ipa" \
            -print

          test -n "$(find build/export -name '*.ipa' -print -quit)"

          echo "IPA created successfully."

      # ---------------------------------------------------------
      # 20. Upload IPA
      # ---------------------------------------------------------
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Q8Basket-iOS-IPA
          path: build/export/*.ipa
          if-no-files-found: error

      # ---------------------------------------------------------
      # 21. Upload Archive
      # ---------------------------------------------------------
      - name: Upload iOS Archive
        uses: actions/upload-artifact@v4
        with:
          name: Q8Basket-iOS-Archive
          path: build/Q8Basket.xcarchive
          if-no-files-found: error

      # ---------------------------------------------------------
      # 22. Cleanup
      # ---------------------------------------------------------
      - name: Cleanup signing files
        if: always()
        run: |
          security delete-keychain build.keychain-db || true
          rm -f distribution.p12
          rm -f profile.plist
          rm -f ExportOptions.plist
