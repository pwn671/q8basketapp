name: Q8Basket iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ios-build:
    name: Build Q8Basket iOS
    runs-on: macos-latest

    env:
      VITE_API_BASE_URL: https://admin.q8basket.com/api

      DEVELOPMENT_TEAM: 5J9VJRYZMN
      PRODUCT_BUNDLE_IDENTIFIER: com.q8basket.app

      P12_BASE64: ${{ secrets.P12_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}

      KEYCHAIN_PASSWORD: q8basket-ci-build-password

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================

      - name: Checkout code
        uses: actions/checkout@v4


      # =========================================================
      # 2. SETUP NODE
      # =========================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm


      # =========================================================
      # 3. INSTALL NPM DEPENDENCIES
      # =========================================================

      - name: Install dependencies
        run: npm ci


      # =========================================================
      # 4. BUILD WEB APP
      # =========================================================

      - name: Build web app
        run: npm run build


      # =========================================================
      # 5. SYNC CAPACITOR IOS
      # =========================================================

      - name: Sync Capacitor iOS
        run: npx cap sync ios


      # =========================================================
      # 6. INSTALL COCOAPODS
      # =========================================================

      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: |
          pod install --repo-update


      # =========================================================
      # 7. CREATE TEMPORARY KEYCHAIN
      # =========================================================

      - name: Create signing keychain
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/q8basket-build.keychain-db"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH"

          security default-keychain \
            -s "$KEYCHAIN_PATH"

          echo "Temporary keychain created."


      # =========================================================
      # 8. DECODE P12
      # =========================================================

      - name: Decode P12
        run: |
          echo "Decoding Apple Distribution certificate..."

          echo "$P12_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/distribution.p12"

          echo "P12 file information:"

          ls -lh "$RUNNER_TEMP/distribution.p12"

          file "$RUNNER_TEMP/distribution.p12"


      # =========================================================
      # 9. VERIFY P12 PASSWORD
      # =========================================================

      - name: Verify P12
        run: |
          echo "Verifying P12 password..."

          openssl pkcs12 \
            -info \
            -in "$RUNNER_TEMP/distribution.p12" \
            -noout \
            -passin pass:"$P12_PASSWORD"

          echo "P12 verification successful."


      # =========================================================
      # 10. IMPORT APPLE DISTRIBUTION CERTIFICATE
      # =========================================================

      - name: Install signing certificate
        run: |
          echo "Importing Apple Distribution certificate..."

          security import \
            "$RUNNER_TEMP/distribution.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/xcodebuild

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          echo ""
          echo "Installed signing identities:"

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"


      # =========================================================
      # 11. DECODE PROVISIONING PROFILE
      # =========================================================

      - name: Decode provisioning profile
        run: |
          echo "Decoding provisioning profile..."

          echo "$PROVISION_PROFILE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/Q8Basket.mobileprovision"

          ls -lh "$RUNNER_TEMP/Q8Basket.mobileprovision"


      # =========================================================
      # 12. READ PROVISIONING PROFILE
      # =========================================================

      - name: Read provisioning profile
        run: |
          PROFILE_PATH="$RUNNER_TEMP/Q8Basket.mobileprovision"

          security cms \
            -D \
            -i "$PROFILE_PATH" \
            > "$RUNNER_TEMP/profile.plist"

          PROFILE_UUID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :UUID" \
              "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_NAME=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Name" \
              "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_APP_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:application-identifier" \
              "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_TEAM=$(
            /usr/libexec/PlistBuddy \
              -c "Print :TeamIdentifier:0" \
              "$RUNNER_TEMP/profile.plist"
          )

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

          echo "========================================"
          echo "PROVISIONING PROFILE"
          echo "========================================"
          echo "Name: $PROFILE_NAME"
          echo "UUID: $PROFILE_UUID"
          echo "App ID: $PROFILE_APP_ID"
          echo "Team: $PROFILE_TEAM"
          echo "========================================"


      # =========================================================
      # 13. INSTALL PROVISIONING PROFILE
      # =========================================================

      - name: Install provisioning profile
        run: |
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          mkdir -p "$PROFILE_DIR"

          cp \
            "$RUNNER_TEMP/Q8Basket.mobileprovision" \
            "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"

          echo "Provisioning profile installed."

          ls -lh "$PROFILE_DIR"


      # =========================================================
      # 14. CHECK XCODE PROJECT
      # =========================================================

      - name: Check Xcode project
        working-directory: ios/App
        run: |
          echo "========================================"
          echo "XCODE PROJECT"
          echo "========================================"

          xcodebuild \
            -project App.xcodeproj \
            -list


      # =========================================================
      # 15. CHECK XCODE WORKSPACE
      # =========================================================

      - name: Check Xcode workspace
        working-directory: ios/App
        run: |
          echo "========================================"
          echo "XCODE WORKSPACE"
          echo "========================================"

          xcodebuild \
            -workspace App.xcworkspace \
            -list


      # =========================================================
      # 16. VERIFY Q8BASKET SCHEME
      # =========================================================

      - name: Verify Q8Basket scheme
        working-directory: ios/App
        run: |
          echo "Checking Q8Basket scheme..."

          xcodebuild \
            -workspace App.xcworkspace \
            -scheme Q8Basket \
            -showBuildSettings \
            -configuration Release \
            > "$RUNNER_TEMP/q8basket-build-settings.txt"

          echo "Q8Basket scheme found successfully."

          echo ""
          echo "Important build settings:"

          grep -E \
            "PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE" \
            "$RUNNER_TEMP/q8basket-build-settings.txt" \
            || true


      # =========================================================
      # 17. INSTALL XCODEPROJ GEM
      # =========================================================

      - name: Install xcodeproj gem
        run: |
          gem install xcodeproj --no-document


      # =========================================================
      # 18. DISABLE SIGNING FOR PODS
      #
      # IMPORTANT:
      # CocoaPods libraries must NOT use the Q8Basket
      # provisioning profile.
      # =========================================================

      - name: Disable CocoaPods signing
        working-directory: ios/App
        run: |
          ruby <<'RUBY'
          require 'xcodeproj'

          pods_project_path = 'Pods/Pods.xcodeproj'

          unless File.exist?(pods_project_path)
            puts "Pods project not found. Skipping."
            exit 0
          end

          project = Xcodeproj::Project.open(pods_project_path)

          project.targets.each do |target|

            target.build_configurations.each do |config|

              config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
              config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
              config.build_settings['CODE_SIGN_IDENTITY'] = ''
              config.build_settings['CODE_SIGN_IDENTITY[sdk=iphoneos*]'] = ''
              config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ''
              config.build_settings['PROVISIONING_PROFILE'] = ''

            end

          end

          project.save

          puts "CocoaPods signing disabled successfully."
          RUBY


      # =========================================================
      # 19. BUILD IOS ARCHIVE
      #
      # IMPORTANT:
      # Provisioning profile is NOT passed globally here.
      # This prevents Pods from receiving it.
      # =========================================================

      - name: Build iOS Archive
        working-directory: ios/App
        run: |
          echo "========================================"
          echo "BUILDING Q8BASKET IOS ARCHIVE"
          echo "========================================"

          echo "Workspace: App.xcworkspace"
          echo "Scheme: Q8Basket"
          echo "Bundle ID: $PRODUCT_BUNDLE_IDENTIFIER"
          echo "Team ID: $DEVELOPMENT_TEAM"
          echo "Profile: $PROFILE_NAME"
          echo "Profile UUID: $PROFILE_UUID"

          rm -rf "$GITHUB_WORKSPACE/build"

          mkdir -p "$GITHUB_WORKSPACE/build"

          xcodebuild \
            -workspace App.xcworkspace \
            -scheme Q8Basket \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$GITHUB_WORKSPACE/build/Q8Basket.xcarchive" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            clean archive


      # =========================================================
      # 20. CHECK ARCHIVE
      # =========================================================

      - name: Check Archive
        run: |
          echo "========================================"
          echo "CHECKING ARCHIVE"
          echo "========================================"

          if [ ! -d "$GITHUB_WORKSPACE/build/Q8Basket.xcarchive" ]; then
            echo "ERROR: Archive was not created."
            exit 1
          fi

          echo "Archive created successfully."

          ls -lah \
            "$GITHUB_WORKSPACE/build/Q8Basket.xcarchive"


      # =========================================================
      # 21. CREATE EXPORTOPTIONS
      # =========================================================

      - name: Create ExportOptions.plist
        working-directory: ios/App
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">

          <plist version="1.0">
          <dict>

              <key>method</key>
              <string>app-store</string>

              <key>destination</key>
              <string>export</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>${DEVELOPMENT_TEAM}</string>

              <key>signingCertificate</key>
              <string>Apple Distribution</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>${PRODUCT_BUNDLE_IDENTIFIER}</key>
                  <string>${PROFILE_NAME}</string>
              </dict>

              <key>stripSwiftSymbols</key>
              <true/>

              <key>compileBitcode</key>
              <false/>

              <key>uploadSymbols</key>
              <true/>

              <key>manageAppVersionAndBuildNumber</key>
              <false/>

          </dict>
          </plist>
          EOF

          echo "ExportOptions.plist:"
          cat ExportOptions.plist


      # =========================================================
      # 22. EXPORT IPA
      # =========================================================

      - name: Export IPA
        working-directory: ios/App
        run: |
          echo "========================================"
          echo "EXPORTING IPA"
          echo "========================================"

          rm -rf build/export

          mkdir -p build/export

          xcodebuild \
            -exportArchive \
            -archivePath "$GITHUB_WORKSPACE/build/Q8Basket.xcarchive" \
            -exportPath "$PWD/build/export" \
            -exportOptionsPlist "$PWD/ExportOptions.plist"


      # =========================================================
      # 23. CHECK IPA
      # =========================================================

      - name: Check IPA
        working-directory: ios/App
        run: |
          echo "========================================"
          echo "CHECKING IPA"
          echo "========================================"

          find build/export \
            -type f \
            -name "*.ipa" \
            -print

          IPA_FILE=$(
            find build/export \
              -type f \
              -name "*.ipa" \
              | head -n 1
          )

          if [ -z "$IPA_FILE" ]; then
            echo "ERROR: IPA was not created."
            exit 1
          fi

          echo ""
          echo "IPA created successfully:"
          echo "$IPA_FILE"

          ls -lh "$IPA_FILE"


      # =========================================================
      # 24. UPLOAD IPA
      # =========================================================

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Q8Basket-iOS-IPA
          path: ios/App/build/export/*.ipa
          if-no-files-found: error


      # =========================================================
      # 25. UPLOAD ARCHIVE
      # =========================================================

      - name: Upload iOS Archive
        uses: actions/upload-artifact@v4
        with:
          name: Q8Basket-iOS-Archive
          path: build/Q8Basket.xcarchive
          if-no-files-found: error


      # =========================================================
      # 26. CLEANUP
      # =========================================================

      - name: Cleanup
        if: always()
        run: |
          echo "Cleaning temporary signing files..."

          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true

          rm -f "$RUNNER_TEMP/distribution.p12"
          rm -f "$RUNNER_TEMP/Q8Basket.mobileprovision"
          rm -f "$RUNNER_TEMP/profile.plist"
          rm -f "$RUNNER_TEMP/q8basket-build-settings.txt"

          rm -f \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision" \
            2>/dev/null || true

          echo "Cleanup completed."
